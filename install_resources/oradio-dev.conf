# GPIO character device permissions, applied by systemd-tmpfiles-setup-dev
# rather than left to udev. The pinctrl driver is built into the kernel, so the
# nodes exist long before udev's coldplug queue reaches them; without this they
# sit root:root 0600 and oradio-prestart.sh has to wait for udev.
z /dev/gpiochip0 0660 root gpio -
z /dev/gpiochip1 0660 root gpio -
