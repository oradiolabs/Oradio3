# Drop-in for the packaged /usr/lib/systemd/system/logrotate.timer.
#
# /etc/logrotate.d/oradio uses 'size 100k', which is threshold-based: logrotate
# rotates whenever a log exceeds 100k at the moment it runs, and ignores
# daily/weekly directives. How often that check happens is set here, not there.
#
# Debian's timer runs daily. Oradio logs can grow fast during a support session,
# so the check runs hourly instead.

[Timer]
# A drop-in ADDS to the existing OnCalendar list rather than replacing it, so
# the empty assignment is required to clear Debian's daily schedule first.
OnCalendar=
OnCalendar=hourly

# Debian's timer sets a randomised delay to spread load across machines. That is
# pointless on a single appliance and delays rotation unpredictably.
RandomizedDelaySec=0

# Persistent=true would trigger a catch-up run at boot for a missed rotation.
# Unwanted here: it adds disk work to the boot path for logs that are, at worst,
# 100k over threshold.
Persistent=false
