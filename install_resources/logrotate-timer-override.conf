# Drop-in for the packaged /usr/lib/systemd/system/logrotate.timer.
#
# /etc/logrotate.d/oradio uses size, which is threshold-based: logrotate rotates
# whenever a log exceeds size at the moment it runs, and ignores daily/weekly directives.
# How often that check happens is set here, not there.
#
# Debian's timer runs daily. Oradio logs can grow fast during a support session, and
# rms.log takes the output of whatever command RMS sends, so the check runs hourly.

[Timer]
# A drop-in ADDS to the existing OnCalendar list rather than replacing it, so
# the empty assignment is required to clear Debian's daily schedule first.
OnCalendar=
OnCalendar=hourly

# The packaged timer sets AccuracySec=1h, which lets systemd fire the timer at any
# point in the hour following the scheduled time so it can batch wakeups with other
# units. Left alone it would apply to the hourly schedule set above, putting up to
# two hours between rotations and making the interval unpredictable. A minute is
# close enough for log rotation and still allows some batching.
AccuracySec=1m

# Persistent=true would trigger a catch-up run at boot for a missed rotation.
# Unwanted here: it adds disk work to the boot path, and with an hourly schedule a
# missed run is picked up at the next hour boundary anyway.
Persistent=false
