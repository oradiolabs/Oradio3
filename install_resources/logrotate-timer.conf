# Debian runs logrotate once a day with an hour of accuracy slack.
# With 'size 100k' that means a log is only checked once every 24 hours,
# so a runaway writer (traceback.log during an exception loop) can reach
# many megabytes between checks. On a 512 MB board with a small SD card,
# that is a route to a full filesystem.
#
# Hourly checks keep the worst case an hour of growth instead of a day.
# The empty OnCalendar= line is required: the directive accumulates, so
# without the reset the daily schedule would remain alongside the hourly one.

[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=1m
Persistent=true
